services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-musica003
    ports:
      - 5433:5432
    volumes:
      - ./docker/postgres/init.d:/docker-entrypoint-initdb.d
      - ./docker/postgres/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      POSTGRES_DB: ${POSTGRES_DB}
    hostname: postgres
    restart: always
    user: root
    networks:
      - app_network

  pgadmin4:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4-musica003
    ports:
      - 8081:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      - postgres
    networks:
      - app_network

  # Rocket API（ビルド済みバイナリを実行）
  rocket-api:
    image: debian:bookworm-slim
    container_name: rocket-api-musica003
    volumes:
      - ./target/release/my-rocket-api:/app/my-rocket-api:ro
      - ./Rocket.toml:/app/Rocket.toml:ro
    working_dir: /app
    command: ./my-rocket-api
    ports:
      - 8000:8000
    environment:
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx-musica003
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - rocket-api
    networks:
      - app_network

volumes:
  db-data:
  pgadmin-data:

networks:
  app_network:
    driver: bridge
